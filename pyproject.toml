[project]
name = "clinic-booking"
version = "0.1.0"
description = "Clinic appointment booking REST API (Savannah Informatics backend assessment)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    # FastAPI leaves Starlette's upper bound open; the 1.x line is very new and
    # changes routing internals, so we pin below it for reproducible behaviour.
    "starlette>=0.46,<1.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
